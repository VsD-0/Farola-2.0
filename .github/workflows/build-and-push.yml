name: Build, Test and Push Docker Image

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Farola.slnx

      - name: Build
        run: dotnet build Farola.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Farola.slnx --no-build --configuration Release --verbosity normal

      - name: Docker Build (without push)
        run: docker build -f src/Farola.WebApi/Dockerfile -t farola-api:test .

  push-to-registry:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/Farola.WebApi/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/farola-api:latest
            ${{ secrets.DOCKER_USERNAME }}/farola-api:${{ github.sha }}
