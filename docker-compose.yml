# 
services:
  farola-api:
    build: .
    container_name: farola-api
    ports:
      - "5000:80"      # Сопоставляет порт 5000 хоста с портом 80 контейнера
      - "5001:443"     # Для HTTPS (если настроен)
    depends_on:
      - postgres-db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Database=Farola;Username=postgres;Password=FarolaPassword123

  postgres-db:
    image: postgres:16
    container_name: farola-postgres
    environment:
      POSTGRES_PASSWORD: FarolaPassword123
      POSTGRES_DB: Farola
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  