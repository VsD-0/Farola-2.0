$kind: http-request
name: Login
method: POST
url: "{{baseUrl}}/api/auth/login"
scripts:
  - type: afterResponse
    code: "const response = pm.response.json();\r

      if (response.accessToken) {\r

      \    pm.environment.set(\"accessToken\", response.accessToken);\r

      \    console.log(\"accessToken\");\r

      \    console.log(pm.environment.get(\"accessToken\"));\r

      }"
    language: text/javascript
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "newuser@example.com",
      "password": "password123",
      "deviceId": "{{deviceId}}",
      "deviceName": "My Device"
    }
