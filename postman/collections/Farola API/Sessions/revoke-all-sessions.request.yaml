$kind: http-request
name: Revoke All Other Sessions
method: POST
url: "{{baseUrl}}/api/sessions/revoke-all"
order: 3000
headers:
  Authorization: Bearer {{accessToken}}
  X-Device-Id: "{{deviceId}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "{{password}}"
    }
